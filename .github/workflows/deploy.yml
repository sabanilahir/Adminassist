name: Deploy to Windows Server (CD)

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch: # Memunculkan tombol "Run workflow"

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to C:\Assists
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          Write-Host "Installing dependencies..."
          npm ci

      - name: Generate Prisma Client
        run: |
          Write-Host "Generating Prisma client..."
          npx prisma generate

      - name: Prepare Environment for Build
        run: |
          # Gunakan .env produksi dari C:\Assists jika ada, atau buat dummy DATABASE_URL agar build tidak gagal
          if (Test-Path "C:\Assists\.env") {
            Write-Host "Menggunakan file .env dari C:\Assists..."
            Copy-Item -Path "C:\Assists\.env" -Destination ".env" -Force
          } else {
            Write-Host "Membuat dummy .env untuk kebutuhan build..."
            "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ticket_db" | Out-File -FilePath ".env" -Encoding utf8
          }

      - name: Build Next.js
        env:
          NODE_ENV: production
        run: |
          Write-Host "Building Next.js application for production..."
          npm run build

      - name: Sync Files to C:\Assists
        run: |
          $target = "C:\Assists"
          Write-Host "Syncing files to $target..."

          if (-not (Test-Path -Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          $excludeDirs = @('.git', '.github', 'node_modules')
          $excludeFiles = @('.env')

          # Robocopy source files (kode keluar 0-7 adalah sukses)
          & robocopy . $target /E /XD $excludeDirs /XF $excludeFiles /NP /R:2 /W:2
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

          # Copy node_modules
          & robocopy node_modules "$target\node_modules" /E /NP /R:2 /W:2
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy node_modules failed with exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

          Write-Host "Files successfully synced to $target."

      - name: Restart Application Process
        run: |
          $target = "C:\Assists"
          Set-Location -Path $target

          if (Get-Command pm2 -ErrorAction SilentlyContinue) {
            Write-Host "PM2 detected. Restarting application..."
            $pm2Status = pm2 describe adminassist 2>&1
            if ($LASTEXITCODE -eq 0) {
              pm2 restart adminassist
            } else {
              Write-Host "Starting adminassist with PM2 for the first time..."
              pm2 start npm --name "adminassist" -- start
            }
            pm2 save
          }
          elseif (Get-Service -Name "AdminAssist" -ErrorAction SilentlyContinue) {
            Write-Host "Restarting Windows Service: AdminAssist..."
            Restart-Service -Name "AdminAssist"
          }
          else {
            Write-Host "NOTICE: Neither PM2 nor Windows Service 'AdminAssist' found."
          }

          Write-Host "Deployment completed successfully!"
