name: Deploy to Windows Server (CD)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to C:\Assists\source\adminassist
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          Write-Host "Installing dependencies..."
          npm ci

      - name: Generate Prisma Client
        run: |
          Write-Host "Generating Prisma client..."
          npx prisma generate

      - name: Prepare Environment for Build
        run: |
          $target = "C:\Assists\source\adminassist"
          if (Test-Path "$target\.env") {
            Write-Host "Menggunakan file .env dari $target..."
            Copy-Item -Path "$target\.env" -Destination ".env" -Force
          } else {
            Write-Host "Membuat dummy .env untuk kebutuhan build..."
            "DATABASE_URL=postgresql://postgres:Password.123@localhost:5432/ticket_db?schema=public" | Out-File -FilePath ".env" -Encoding utf8
          }

      - name: Sync Database Schema (Auto Migrate)
        run: |
          Write-Host "Updating PostgreSQL database schema..."
          npx prisma db push --accept-data-loss

      - name: Build Next.js
        env:
          NODE_ENV: production
        run: |
          Write-Host "Building Next.js application for production..."
          npm run build

      - name: Stop Old Application Process
        run: |
          Write-Host "Stopping old node process to release file locks..."
          if (Get-Command pm2 -ErrorAction SilentlyContinue) {
            pm2 stop adminassist 2>&1 | Out-Null
          }
          # Hentikan node agar file DLL/binary tidak terkunci
          Stop-Process -Name node -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Sync Files to C:\Assists\source\adminassist
        run: |
          $target = "C:\Assists\source\adminassist"
          Write-Host "Syncing build files and assets to $target..."

          if (-not (Test-Path -Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # Kecualikan git, github, dan node_modules agar tidak terjadi lock
          $excludeDirs = @('.git', '.github', 'node_modules')
          $excludeFiles = @('.env')

          # Salin file source dan folder build .next
          & robocopy . $target /E /XD $excludeDirs /XF $excludeFiles /NP /R:2 /W:2
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

          Write-Host "Files successfully synced to $target."

      - name: Update Prisma Client in Target
        run: |
          $target = "C:\Assists\source\adminassist"
          Set-Location -Path $target
          Write-Host "Updating Prisma client in target..."
          npx prisma generate

      - name: Restart Application Process
        run: |
          $target = "C:\Assists\source\adminassist"
          Set-Location -Path $target

          if (Get-Command pm2 -ErrorAction SilentlyContinue) {
            Write-Host "PM2 detected. Starting application..."
            $pm2Status = pm2 describe adminassist 2>&1
            if ($LASTEXITCODE -eq 0) {
              pm2 restart adminassist --update-env
            } else {
              Write-Host "Starting adminassist with PM2 for the first time..."
              pm2 start npm --name "adminassist" -- start
            }
            pm2 save
          } else {
            Write-Host "NOTICE: PM2 not found. If running manually, start with 'npm start'."
          }

          Write-Host "Deployment completed successfully!"
