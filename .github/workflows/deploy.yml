name: Deploy to Windows Server (CD)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to C:\Assists\source\adminassist
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          Write-Host "Installing dependencies..."
          npm ci

      - name: Generate Prisma Client
        run: |
          Write-Host "Generating Prisma client..."
          npx prisma generate

      - name: Prepare Environment for Build
        run: |
          $target = "C:\Assists\source\adminassist"
          if (Test-Path "$target\.env") {
            Write-Host "Menggunakan file .env dari $target..."
            Copy-Item -Path "$target\.env" -Destination ".env" -Force
          } else {
            Write-Host "Membuat dummy .env untuk kebutuhan build..."
            "DATABASE_URL=postgresql://postgres:Password.123@localhost:5432/ticket_db?schema=public" | Out-File -FilePath ".env" -Encoding utf8
          }

      - name: Sync Database Schema (Auto Migrate)
        run: |
          Write-Host "Updating PostgreSQL database schema..."
          npx prisma db push --accept-data-loss

      - name: Build Next.js
        env:
          NODE_ENV: production
        run: |
          Write-Host "Building Next.js application for production..."
          npm run build

      - name: Stop Old Application Process
        run: |
          Write-Host "Stopping old application process to release file locks..."

          # 1. Coba hentikan via PM2 jika ada
          $pm2Cmd = Get-Command pm2 -ErrorAction SilentlyContinue
          $pm2Bin = if ($pm2Cmd) { $pm2Cmd.Source } else { $null }
          if (-not $pm2Bin) {
            $checkPaths = @(
              (Join-Path $env:APPDATA "npm\pm2.cmd"),
              "C:\Program Files\nodejs\pm2.cmd",
              "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
            )
            foreach ($p in $checkPaths) {
              if (Test-Path $p) { $pm2Bin = $p; break }
            }
          }
          if ($pm2Bin) {
            Write-Host "Menghentikan service via PM2 ($pm2Bin)..."
            & $pm2Bin stop adminassist 2>&1 | Out-Null
          }

          # 2. Hentikan proses node yang sedang listen di port 3000 atau proses node aplikasi
          Write-Host "Memastikan port 3000 dan proses node dilepas..."
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Sync Files to C:\Assists\source\adminassist
        run: |
          $target = "C:\Assists\source\adminassist"
          Write-Host "Syncing build files and assets to $target..."

          if (-not (Test-Path -Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # Kecualikan git, github, dan node_modules agar tidak terjadi lock
          $excludeDirs = @('.git', '.github', 'node_modules')
          $excludeFiles = @('.env')

          # Salin file source dan folder build .next
          & robocopy . $target /E /XD $excludeDirs /XF $excludeFiles /NP /R:2 /W:2
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

          Write-Host "Files successfully synced to $target."

      - name: Update Prisma Client in Target
        run: |
          $target = "C:\Assists\source\adminassist"
          Set-Location -Path $target
          Write-Host "Updating Prisma client in target..."
          npx prisma generate

      - name: Restart Application Process
        run: |
          $target = "C:\Assists\source\adminassist"
          Set-Location -Path $target
          Write-Host "Memulai proses auto-start aplikasi di $target..."

          # 1. Cari binary PM2 di PATH maupun lokasi instalasi global npm Windows
          $pm2Cmd = Get-Command pm2 -ErrorAction SilentlyContinue
          $pm2Bin = if ($pm2Cmd) { $pm2Cmd.Source } else { $null }
          if (-not $pm2Bin) {
            $checkPaths = @(
              (Join-Path $env:APPDATA "npm\pm2.cmd"),
              "C:\Program Files\nodejs\pm2.cmd",
              "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
            )
            foreach ($p in $checkPaths) {
              if (Test-Path $p) { $pm2Bin = $p; break }
            }
          }

          $started = $false

          if ($pm2Bin) {
            Write-Host "[Metode 1] Menggunakan PM2 di $pm2Bin..."
            & $pm2Bin describe adminassist 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Me-restart instance PM2 yang sudah ada..."
              & $pm2Bin restart adminassist --update-env
            } else {
              Write-Host "Mendaftarkan dan menjalankan instance PM2 baru..."
              & $pm2Bin start npm --name "adminassist" --cwd $target -- start
            }
            & $pm2Bin save
            $started = $true
          } else {
            Write-Host "[Metode 2] PM2 tidak terdeteksi di session runner."
            Write-Host "Menjalankan aplikasi langsung sebagai Detached Background Process via WMI..."

            # Menggunakan WMI Win32_Process agar proses tidak dibunuh saat step runner berakhir
            $cmd = "cmd.exe /c npm start"
            $wmiProcess = [wmiclass]"Win32_Process"
            $result = $wmiProcess.Create($cmd, $target, $null)

            if ($result.ReturnValue -eq 0) {
              Write-Host "Aplikasi berhasil dihidupkan di latar belakang! Process ID: $($result.ProcessId)"
              $started = $true
            } else {
              Write-Warning "WMI Create gagal (Kode: $($result.ReturnValue)), mencoba Start-Process fallback..."
              Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm start" -WorkingDirectory $target -WindowStyle Hidden
              $started = $true
            }
          }

          # 2. Verifikasi status aplikasi (Health check)
          Write-Host "Menunggu aplikasi siap (5 detik)..."
          Start-Sleep -Seconds 5
          $portActive = Test-NetConnection -ComputerName 127.0.0.1 -Port 3000 -InformationLevel Quiet

          if ($portActive) {
            Write-Host "================================================="
            Write-Host "  APLIKASI SUKSES MENYALA & AKTIF DI PORT 3000!  "
            Write-Host "  URL: http://10.17.8.35:3000                    "
            Write-Host "================================================="
          } else {
            Write-Host "Pemberitahuan: Port 3000 sedang dalam proses startup (Next.js compiling/warming up)."
            Write-Host "Silakan akses browser dalam beberapa saat."
          }

          Write-Host "Deployment completed successfully!"
